<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleHub - Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">StyleHub</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>

<main class="container">

    <div class="checkout-box">

        <h1>Checkout</h1>

        <form>

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter your address" required>

            <label for="city">City</label>
            <input type="text" id="city" placeholder="Enter your city" required>

            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" placeholder="Enter pincode" required>

            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="Enter phone number" required>

            <h3>Payment Method</h3>

            <div class="payment-options">

                <label>
                    <input type="radio" name="payment" value="cod" required>
                    Cash on Delivery
                </label>

                <label>
                    <input type="radio" name="payment" value="upi">
                    UPI
                </label>

                <label>
                    <input type="radio" name="payment" value="card">
                    Credit/Debit Card
                </label>

            </div>

            <button type="submit" class="btn">
                Place Order
            </button>

        </form>

    </div>

</main>

<footer>
    <p>Contact: support@stylehub.com | Phone: +91 98765 43210</p>
    <p>&copy; 2026 StyleHub. All Rights Reserved.</p>
</footer>

</body>
</html>
